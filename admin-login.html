<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SpendWise Admin Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SpendWise config -->
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 26px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #000000;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #111827;
    }

    .security {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <div class="logo-icon">🛡️</div>

      <h1>Admin Login</h1>

      <p class="subtitle">
        SpendWise Administration Panel
      </p>
    </div>

    <div id="message" class="message"></div>

    <form id="adminLoginForm">

      <label for="email">Admin Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
        autocomplete="email"
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
        autocomplete="current-password"
      >

      <button type="submit" id="loginBtn">
        Login to Admin Dashboard
      </button>

    </form>

    <a href="index.html" class="back">
      ← Back to SpendWise
    </a>

    <div class="security">
      🔒 Authorized administrators only
    </div>

  </div>

<script>

  let supabaseClient = null;

  const CONFIG = {
    url: String(window.SPENDWISE_CONFIG?.SUPABASE_URL || '').trim(),
    key: String(window.SPENDWISE_CONFIG?.SUPABASE_ANON_KEY || '').trim()
  };

  const message = document.getElementById('message');
  const form = document.getElementById('adminLoginForm');
  const loginBtn = document.getElementById('loginBtn');

  function showMessage(text, type = 'error') {
    message.textContent = text;
    message.className = 'message ' + type;
  }

  function clearMessage() {
    message.textContent = '';
    message.className = 'message';
  }

  // Initialize Supabase
  function initSupabase() {

    if (!CONFIG.url || !CONFIG.key) {
      showMessage('Supabase configuration is missing.');
      return false;
    }

    if (!window.supabase) {
      showMessage('Supabase library failed to load.');
      return false;
    }

    supabaseClient = window.supabase.createClient(
      CONFIG.url,
      CONFIG.key
    );

    return true;
  }

  // Check whether the logged-in account is an approved admin
  async function checkAdminAccess() {

    try {

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        return false;
      }

      const { data, error } = await supabaseClient
        .from('profiles')
        .select('role, status')
        .eq('id', user.id)
        .single();

      if (error || !data) {
        return false;
      }

      return (
        data.role === 'admin' &&
        data.status === 'approved'
      );

    } catch (error) {

      console.error('Admin check error:', error);

      return false;
    }
  }

  // Login
  form.addEventListener('submit', async function(event) {

    event.preventDefault();

    clearMessage();

    const email = document
      .getElementById('email')
      .value
      .trim();

    const password = document
      .getElementById('password')
      .value;

    if (!email || !password) {
      showMessage('Please enter your email and password.');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Checking...';

    try {

      if (!supabaseClient) {
        if (!initSupabase()) {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login to Admin Dashboard';
          return;
        }
      }

      // Sign in
      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error('Login failed.');
      }

      // Check admin permissions
      const isAdmin = await checkAdminAccess();

      if (!isAdmin) {

        // Immediately sign the account back out
        await supabaseClient.auth.signOut();

        showMessage(
          'Access denied. This account is not an approved administrator.'
        );

        loginBtn.disabled = false;
        loginBtn.textContent = 'Login to Admin Dashboard';

        return;
      }

      showMessage(
        'Login successful. Opening admin dashboard...',
        'success'
      );

      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 700);

    } catch (error) {

      console.error('Login error:', error);

      showMessage(
        error.message ||
        'Unable to login. Please check your email and password.'
      );

      loginBtn.disabled = false;
      loginBtn.textContent = 'Login to Admin Dashboard';
    }

  });

  // Initialize immediately
  initSupabase();

</script>

</body>
</html>
